server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;            # don't advertise the nginx version
    client_max_body_size 1m;      # notes are capped at 10k chars

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Security headers (nginx layer). TLS is expected to terminate in front of this
    # container (Azure Front Door / App Gateway); HSTS is honoured once served over HTTPS.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # React SPA — all routes fall back to index.html; never cache the shell
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        # add_header in a location replaces the server-level set, so repeat them
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Proxy /api to FastAPI backend (the backend sets its own security headers).
    # Add this container's network range to the backend's TRUSTED_PROXIES so the
    # X-Forwarded-* headers below are honoured.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
